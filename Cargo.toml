[workspace]
resolver = "2"
members = [
    "crates/novaserve-tensor",
    "crates/novaserve-frontend",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Ardhya Novri Ramadhan <ardhyasan@gmail.com>"]

[workspace.dependencies]
thiserror = "2.0"
memmap2 = "0.9"
rayon = "1.10"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
